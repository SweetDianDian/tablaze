name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-and-package:
    name: Linux / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      # CI uses Playwright-managed Chromium, never a developer's browser channel.
      TABLAZE_BROWSER_CHANNEL: ""
      TABLAZE_EXECUTABLE_PATH: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install managed Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run build, real browser tests and MCP protocol tests
        run: npm test 2>&1 | tee test-output.log
      - name: Inspect package contents without publishing
        run: npm pack --dry-run 2>&1 | tee pack-output.log
      - name: Retain verification logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: verification-node-${{ matrix.node }}
          path: |
            test-output.log
            pack-output.log
          if-no-files-found: ignore
          retention-days: 14
